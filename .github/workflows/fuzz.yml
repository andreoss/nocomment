name: fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: make generate
      - run: make corpus
      - run: go test ./internal/fuzz -run='^$' -fuzz=FuzzStrip -fuzztime=10m
